name: Generate Evidence

run-name: Evidence ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Validation request ID
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --json > npm-audit.json || true

      # Keep these non-fatal so a failed check is still captured as evidence.
      # `steps.<id>.outcome` retains the real result under continue-on-error.
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Generate evidence
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const crypto = require("crypto");
          const { execSync } = require("child_process");

          const audit = JSON.parse(
            fs.readFileSync("npm-audit.json", "utf8")
          );

          const vulnerabilities =
            audit.metadata?.vulnerabilities ?? {};

          // Every claim downstream is a claim about *these bytes*. `npm pack`
          // produces the tarball this package would publish; its sha256 is the
          // artifact identity the ZK circuit binds the proof to.
          //
          // This does NOT need to be reproducible across runs. The circuit only
          // requires the same 32 bytes in the private evidence and in the public
          // input of one proof, so tarball mtime jitter is irrelevant here.
          const tarball = execSync("npm pack --silent")
            .toString()
            .trim()
            .split("\n")
            .filter(Boolean)
            .pop();

          const artifactDigest =
            "sha256:" +
            crypto
              .createHash("sha256")
              .update(fs.readFileSync(tarball))
              .digest("hex");

          const evidence = {
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            artifactDigest,
            vulnerabilities: {
              critical: vulnerabilities.critical ?? 0,
              high: vulnerabilities.high ?? 0,
              moderate: vulnerabilities.moderate ?? 0,
              low: vulnerabilities.low ?? 0,
              total: vulnerabilities.total ?? 0
            },
            checks: {
              lint: {
                command: "npm run lint",
                passed: process.env.LINT_OUTCOME === "success"
              },
              build: {
                command: "npm run build",
                passed: process.env.BUILD_OUTCOME === "success"
              }
            }
          };

          fs.writeFileSync(
            "evidence.json",
            JSON.stringify(evidence, null, 2)
          );
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: zkuat-evidence-${{ inputs.request_id || github.sha }}
          path: ui/evidence.json
          retention-days: 1
